# Ejemplo para instalar solo tras inventariar los vhosts existentes.
# Primero emitir el certificado con un vhost HTTP de ACME. No cargar este archivo
# antes de que existan los archivos de certificado.
server {
    listen 80;
    server_name dispensalud.site www.dispensalud.site;
    location /.well-known/acme-challenge/ { root /var/www/dispensalud-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dispensalud.site www.dispensalud.site;
    ssl_certificate /etc/letsencrypt/live/dispensalud.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispensalud.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/dispensalud-access.log;
    error_log /var/log/nginx/dispensalud-error.log;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
