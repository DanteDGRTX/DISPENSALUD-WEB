spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.schema=dispensalud_private
spring.flyway.default-schema=dispensalud_private
spring.flyway.schemas=dispensalud_private
dispensalud.registration.enabled=${DISPENSALUD_REGISTRATION_ENABLED:false}
