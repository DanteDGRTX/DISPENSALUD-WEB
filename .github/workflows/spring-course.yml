name: Spring course integration
on:
  pull_request:
  push:
    branches: [feature/spring-course-integration]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring/**/pom.xml
      - run: mvn --batch-mode -f spring/pom.xml verify
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r web/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: python manage.py test portal
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: spring-web-assets
          path: |
            web/portal/static/portal/firebase/app.js
            web/portal/static/portal/firebase/panel-web.css
